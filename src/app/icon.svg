<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Code mark "</>" on the brand gradient: reads as "web developer" at any size and
       stands out on both dark and light browser tab bars. -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f7a5c"/>
      <stop offset="1" stop-color="#5b4ce0"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="18" fill="url(#g)"/>
  <g fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M21 20 L9 32 L21 44"/>
    <path d="M43 20 L55 32 L43 44"/>
    <path d="M36.5 15 L27.5 49"/>
  </g>
</svg>
